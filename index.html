<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101827">
  <title>CELULAR 360</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <header class="encabezado">
    <h1>📱 CELULAR 360</h1>
    <p>Sistema de gestión y diagnóstico móvil</p>
  </header>

  <main class="contenedor">

    <section class="resumen">
      <h2>Panel principal</h2>
      <p>Equipos registrados</p>
      <strong id="total">0</strong>
    </section>

    <section class="modulos">
      <h2>Módulos de trabajo</h2>

      <button onclick="registrar()">📱 Registrar equipo</button>
      <button onclick="registrarCliente()">👤 Registrar cliente</button>
      <button onclick="diagnostico()">🔍 Diagnóstico</button>
      <button onclick="inventario()">📦 Inventario</button>
      <button onclick="historial()">📋 Historial</button>
      <button onclick="reparacionesPendientes()">🛠️ Reparaciones pendientes</button>
    </section>

    <section id="resultado" class="resultado">
      <h2>Bienvenido a CELULAR 360</h2>
      <p>Selecciona un módulo para comenzar.</p>
    </section>

  </main>

  <footer>
    <p>CELULAR 360 © 2026</p>
  </footer>

  <script src="app.js?v=12"></script>

</body>
</html>
